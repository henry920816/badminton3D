services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: badminton
    ports:
    - 5432:5432
    volumes:
    - badminton_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d badminton || pg_isready -U postgres
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/badminton
      CORS_ORIGINS: http://localhost:5173
    ports:
    - 8000:8000
    depends_on:
      db:
        condition: service_healthy

volumes:
  badminton_pgdata: {}

